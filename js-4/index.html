<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Results</title>
</head>

<body>


    <div class="card">

        <h1 class="title">ARSENAL FC</h1>

        <div class="container">

            <div class="logo-box">
                <img id="logo">
            </div>

            <div class="info">

                <p> <strong>Club Name:</strong>
                    <span id="club-name"></span>
                </p>

                <p>
                    <strong>City:</strong>
                    <span id="club-city"></span>
                </p>

                <p>
                    <strong>Founded:</strong>
                    <span id="founded"></span>
                </p>
                <p>
                    <strong>League:</strong>
                    <span id="league"></span>
                </p>
                <p>
                    <strong>Stadium:</strong>
                    <span id="stadium"></span>
                </p>

            </div>

        </div>

    </div>





    <script defer src="script.js"></script>
</body>

</html>
